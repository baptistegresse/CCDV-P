<g class="r27"><text x="606" y="294" class="small mono green" text-anchor="start">stop_reason: end_turn</text></g>
<g class="r28"><text x="24" y="356" class="label" text-anchor="start">Full turn =</text></g>
<g class="r29"><rect class="chip" x="106" y="338" width="34" height="26" rx="6"/><text x="123" y="356" class="label" text-anchor="middle">A</text></g>
