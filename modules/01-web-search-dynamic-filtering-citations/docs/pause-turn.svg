<rect class="bg" x="0.5" y="0.5" width="879" height="429" rx="10"/>
<text x="24" y="34" class="title" text-anchor="start">Resuming a paused search turn (stop_reason: pause_turn)</text>
<text x="24" y="54" class="small muted" text-anchor="start">Each continuation returns only NEW content, so you send everything back, in order</text>
<text x="24" y="86" class="small muted" text-anchor="start">you send</text>
<text x="560" y="86" class="small muted" text-anchor="start">API returns</text>
