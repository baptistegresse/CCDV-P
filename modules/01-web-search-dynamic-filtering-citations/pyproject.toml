[project]
name = "cited-search"
version = "0.1.0"
description = "Ask Claude questions answered with live web search, dynamic filtering and cited sources."
readme = "README.md"
authors = [{ name = "Baptiste Gresse" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
]

[project.scripts]
cited-search = "cited_search.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
